# Backtesting configuration
backtest:
  enabled: true
  initial_capital: 10000
  start_date: "2020-01-01"
  end_date: "2023-12-31"
  
  # Transaction costs
  transaction_costs:
    enabled: true
    commission: 0.001  # 0.1% commission
    slippage: 0.0005  # 0.05% slippage
  
  # Strategies
  strategies:
    - name: "buy_and_hold"
      type: "buy_and_hold"
      description: "Simple buy and hold strategy"
    
    - name: "momentum"
      type: "momentum"
      threshold: 0.02
      lookback_window: 20
      description: "Momentum strategy based on predictions"
    
    - name: "mean_reversion"
      type: "mean_reversion"
      threshold: 0.02
      lookback_window: 20
      description: "Mean reversion strategy"
    
    - name: "threshold"
      type: "threshold"
      buy_threshold: 0.01
      sell_threshold: -0.01
      description: "Threshold-based strategy"
  
  # Risk management
  risk_management:
    max_position_size: 1.0
    stop_loss: 0.05  # 5% stop loss
    take_profit: 0.10  # 10% take profit
    max_drawdown: 0.20  # 20% max drawdown
    
  # Benchmark
  benchmark:
    symbol: "^GSPC"  # S&P 500
    enabled: true
