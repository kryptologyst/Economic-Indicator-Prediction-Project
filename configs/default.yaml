# Default configuration for Economic Indicator Prediction

# Data configuration
data:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  
  # Data sources
  sources:
    fred:
      enabled: true
      api_key: "demo"  # Use demo key for now
      series_ids:
        - "GDPC1"  # Real GDP
        - "CPIAUCSL"  # Consumer Price Index
        - "UNRATE"  # Unemployment Rate
        - "FEDFUNDS"  # Federal Funds Rate
        - "PAYEMS"  # Nonfarm Payrolls
    
    yahoo_finance:
      enabled: true
      symbols:
        - "^GSPC"  # S&P 500
        - "^TNX"  # 10-Year Treasury
        - "DXY"  # Dollar Index
        - "GLD"  # Gold ETF
  
  # Data preprocessing
  preprocessing:
    handle_missing: "forward_fill"
    scaling: "standard"
    create_lags: true
    lag_periods: [1, 2, 3, 5, 10]
    create_rolling_features: true
    rolling_windows: [5, 10, 20, 30]
    rolling_functions: ["mean", "std"]

# Feature engineering
features:
  technical_indicators:
    enabled: true
    sma:
      enabled: true
      windows: [5, 10, 20, 50]
    ema:
      enabled: true
      windows: [5, 10, 20, 50]
    rsi:
      enabled: true
      window: 14
    macd:
      enabled: true
      fast: 12
      slow: 26
      signal: 9
    bollinger_bands:
      enabled: true
      window: 20
      num_std: 2
  
  economic_features:
    enabled: true
    growth_rates:
      enabled: true
      periods: [1, 3, 6, 12]
    volatility:
      enabled: true
      window: 30
    seasonal_decomposition:
      enabled: true
      model: "additive"
  
  time_features:
    enabled: true
    cyclical_encoding: true
    business_day_features: true
  
  lag_features:
    enabled: true
    columns: ["GDP_Growth", "Inflation", "Interest_Rate"]
    lags: [1, 2, 3, 5, 10]
  
  feature_selection:
    enabled: true
    correlation_filter:
      enabled: true
      threshold: 0.95
    variance_filter:
      enabled: true
      threshold: 0.01
    mutual_information:
      enabled: true
      k: 20

# Model configuration
model:
  type: "ensemble"  # linear, tree, neural_network, arima, ensemble
  
  # Individual model configurations
  models:
    - type: "linear"
      model_type: "ridge"
      alpha: 1.0
    
    - type: "tree"
      model_type: "xgboost"
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      random_state: 42
    
    - type: "neural_network"
      hidden_size: 64
      num_layers: 2
      dropout: 0.2
      epochs: 100
      batch_size: 32
      learning_rate: 0.001
      patience: 10
    
    - type: "arima"
      auto_arima: true
      order: [1, 1, 1]
      seasonal_order: [0, 0, 0, 0]
  
  # Ensemble configuration
  ensemble:
    weights: [0.3, 0.4, 0.2, 0.1]  # Equal weights if not specified

# Training configuration
training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  cv_folds: 5
  cv_method: "time_series"
  
  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
  
  # Hyperparameter tuning
  hyperparameter_tuning:
    enabled: false
    method: "grid_search"  # grid_search, random_search, bayesian
    n_trials: 50

# Evaluation configuration
evaluation:
  ml_metrics:
    - "mse"
    - "mae"
    - "rmse"
    - "mape"
    - "smape"
    - "r2"
    - "mase"
  
  financial_metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "max_drawdown"
    - "calmar_ratio"
    - "hit_rate"
    - "volatility"
    - "skewness"
    - "kurtosis"
  
  # Cross-validation
  cv:
    n_splits: 5
    test_size: 0.2
  
  # Backtesting
  backtest:
    enabled: true
    initial_capital: 10000
    strategies:
      - type: "buy_and_hold"
      - type: "momentum"
        threshold: 0.02
      - type: "mean_reversion"
        threshold: 0.02

# Risk management
risk:
  calculate_var: true
  var_confidence: 0.05
  run_stress_tests: true
  quantify_uncertainty: true
  uncertainty_method: "bootstrap"  # bootstrap, conformal
  
  # Stress test scenarios
  stress_scenarios:
    - name: "recession"
      type: "recession"
      factor: 0.8
    - name: "high_inflation"
      type: "inflation"
      factor: 1.5
    - name: "interest_rate_shock"
      type: "shock"
      shocks:
        Interest_Rate: 0.02

# Logging configuration
logging:
  level: "INFO"
  log_file: "logs/training.log"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Output configuration
output:
  save_predictions: true
  save_model: true
  save_plots: true
  output_dir: "assets/results"
  
  # Plot configuration
  plots:
    prediction_plot: true
    residual_plot: true
    feature_importance_plot: true
    backtest_plot: true
    risk_plot: true
